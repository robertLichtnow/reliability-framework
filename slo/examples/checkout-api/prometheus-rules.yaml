      > 0.0072
    labels:
      service: checkout-api
      slo: availability
      severity: page
      long_window: 1h
      short_window: 5m
    annotations:
      summary: checkout-api/availability is burning its error budget 14.4x faster than sustainable
      description: 'At this rate 2% of the 30-day error budget is consumed in 1h. Objective: 99.95%.'

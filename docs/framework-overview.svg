<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" font-family="Helvetica, Arial, sans-serif">
  <title>How the reliability framework modules fit together</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <style>
      .gov { fill: #eef2ff; stroke: #4f46e5; stroke-width: 1.5; }
      .step { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.5; }
      .plat { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.5; }
      .line { stroke: #374151; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .loop { stroke: #6b7280; stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrow); }
      .tb { font-size: 16px; font-weight: bold; fill: #111827; text-anchor: middle; }
      .s { font-size: 13px; fill: #4b5563; text-anchor: middle; }
    </style>
  </defs>
  <rect width="960" height="420" fill="#ffffff"/>

  <!-- Governance -->
  <rect x="40" y="20" width="880" height="64" rx="10" class="gov"/>
  <text x="480" y="47" class="tb">Governance</text>
  <text x="480" y="68" class="s">Service tiers, production readiness reviews, reliability reports: every important service follows the same standard</text>

  <!-- Flow -->
  <rect x="40" y="130" width="190" height="80" rx="10" class="step"/>
  <text x="135" y="162" class="tb">SLOs</text>
  <text x="135" y="184" class="s">Define what "reliable"</text>
  <text x="135" y="200" class="s">means for users</text>

  <rect x="270" y="130" width="190" height="80" rx="10" class="step"/>
  <text x="365" y="162" class="tb">Observability</text>
  <text x="365" y="184" class="s">Measure it with metrics,</text>
  <text x="365" y="200" class="s">logs and traces</text>

  <rect x="500" y="130" width="190" height="80" rx="10" class="step"/>
  <text x="595" y="162" class="tb">Alerts</text>
  <text x="595" y="184" class="s">Fire when the error</text>
  <text x="595" y="200" class="s">budget burns too fast</text>

  <rect x="730" y="130" width="190" height="80" rx="10" class="step"/>
  <text x="825" y="162" class="tb">Incident response</text>
  <text x="825" y="184" class="s">Restore service, then</text>
  <text x="825" y="200" class="s">learn in a postmortem</text>

  <path d="M230,170 L268,170" class="line"/>
  <path d="M460,170 L498,170" class="line"/>
  <path d="M690,170 L728,170" class="line"/>

  <!-- Feedback loop -->
  <path d="M825,210 L825,250 L135,250 L135,212" class="loop"/>
  <text x="480" y="270" class="s">Lessons learned improve targets, measurements and platforms</text>

  <!-- Platform -->
  <rect x="40" y="300" width="880" height="96" rx="10" class="plat"/>
  <text x="480" y="326" class="tb">Platform practices: prevent the most common failures</text>
  <rect x="80" y="340" width="240" height="40" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="1.2"/>
  <text x="200" y="365" class="s" style="font-size:14px;fill:#111827">High-availability Kubernetes</text>
  <rect x="360" y="340" width="240" height="40" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="1.2"/>
  <text x="480" y="365" class="s" style="font-size:14px;fill:#111827">Database reliability</text>
  <rect x="640" y="340" width="240" height="40" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="1.2"/>
  <text x="760" y="365" class="s" style="font-size:14px;fill:#111827">Event-driven systems</text>
</svg>

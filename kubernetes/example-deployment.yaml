# Annotated example: a highly available stateless web service.
# Numbers in comments refer to the workload checklist in README.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-api
  namespace: example
  labels:
    app.kubernetes.io/name: example-api
spec:
  # No `replicas` here: the autoscaler owns the count (10). Setting it in Git
  # would reset the live count on every GitOps sync, even mid-peak.
  revisionHistoryLimit: 5
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0                         # (9) never drop below desired capacity
      maxSurge: 25%
  selector:
    matchLabels:
      app.kubernetes.io/name: example-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: example-api
    spec:
      terminationGracePeriodSeconds: 45         # (8) longer than preStop + slowest request
      topologySpreadConstraints:                # (2) spread across zones (hard), then nodes (soft)
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor               # ignore unreachable nodes, so a lost zone does not block the others
          matchLabelKeys: ["pod-template-hash"] # spread each version on its own, so rollouts keep every zone covered
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: example-api
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          matchLabelKeys: ["pod-template-hash"]
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: example-api
      securityContext:                          # (11)
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # (12) pin by digest in real deployments, e.g. image@sha256:<digest>
          image: registry.example.com/example-api:1.4.2
          ports:
            - name: http
              containerPort: 8080
          resources:                            # (7)
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 512Mi                     # no CPU limit: avoids throttling; requests guarantee share
          startupProbe:                         # (6) allow up to 60s to boot
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:                       # (4) can this pod serve? (started, warmed up, not overloaded)
            httpGet:                            #     don't check shared dependencies such as the database:
              path: /ready                      #     if they fail, every replica goes unready at once
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:                        # (5) process health only, never dependencies
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 6
          lifecycle:
            preStop:                            # (8) let load balancers stop sending traffic first
                                                # (sleep action needs Kubernetes 1.30+; older: exec ["sleep","10"],
                                                #  which needs a sleep binary in the image; distroless images have none)
              sleep:
                seconds: 10
          securityContext:                      # (11)
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp                         # writable scratch space despite the read-only root filesystem
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget                       # (3)
metadata:
  name: example-api
  namespace: example
spec:
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow       # crash-looping pods must not block node drains and upgrades
  selector:
    matchLabels:
      app.kubernetes.io/name: example-api
---
# (10) Plain HPA for a simple CPU-bound service. With KEDA, replace this with a
# ScaledObject; never run both on the same workload.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: example-api
  namespace: example
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: example-api
  minReplicas: 3                                # (1) minimum for user-facing services
  maxReplicas: 20                               # what the database and other dependencies can handle
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65                # losing one zone of three pushes the rest to about 98%

# Annotated example: a highly available stateless web service.
# Numbers in comments refer to the workload checklist in README.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-api
  namespace: example
  labels:
    app.kubernetes.io/name: example-api
spec:
  replicas: 3                                   # (1) minimum for user-facing services
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0                         # (9) never drop below desired capacity
      maxSurge: 25%
  selector:
    matchLabels:
      app.kubernetes.io/name: example-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: example-api
    spec:
      terminationGracePeriodSeconds: 45         # (8) longer than preStop + slowest request
      topologySpreadConstraints:                # (2) spread across zones, then nodes
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: example-api
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: example-api
      securityContext:                          # (11)
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # (12) pin by digest in real deployments, e.g. image@sha256:<digest>
          image: registry.example.com/example-api:1.4.2
          ports:
            - name: http
              containerPort: 8080
          resources:                            # (7)
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 512Mi                     # no CPU limit: avoids throttling; requests guarantee share
          startupProbe:                         # (6) allow up to 60s to boot
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:                       # (4) may check critical dependencies
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:                        # (5) process health only, never dependencies
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 6
          lifecycle:
            preStop:                            # (8) let load balancers stop sending traffic first
                                                # (sleep action needs Kubernetes 1.30+; older: exec ["sleep","10"])
              sleep:
                seconds: 10
          securityContext:                      # (11)
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: policy/v1
kind: PodDisruptionBudget                       # (3)
metadata:
  name: example-api
  namespace: example
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: example-api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler                   # (10)
metadata:
  name: example-api
  namespace: example
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: example-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65

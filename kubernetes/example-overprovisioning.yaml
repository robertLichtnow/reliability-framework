# Overprovisioning with low-priority pause pods (checklist item 16).
#
# The placeholder pods request real CPU and memory but do nothing. Because
# their priority is lower than every real workload, the scheduler evicts them
# the moment a real pod needs room, and the real pod starts on an existing
# node within seconds. The evicted placeholders become pending, which makes
# the cluster autoscaler (Karpenter or Cluster Autoscaler) add a new node in
# the background, restoring the buffer.
#
# Size the buffer to absorb a typical scale-up burst. Make each placeholder at
# least as large as the largest pod it must make room for. A lost zone takes
# its share of the buffer with it, so size the remaining two-thirds to hold one
# zone's critical pods.
#
# Further reading:
# https://abozar-alizadeh.medium.com/the-kubernetes-overprovisioning-playbook-how-a-simple-pause-pod-can-eliminate-scaling-delays-in-0ec95688dbe3
apiVersion: v1
kind: Namespace
metadata:
  name: capacity-buffer               # not kube-system: system pods there can block node scale-down
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: overprovisioning
value: -10                          # below the default (0), so any real pod preempts it;
                                    # do not go lower: Cluster Autoscaler ignores pods below -10
                                    # and would not restore the buffer
globalDefault: false
description: Placeholder pods that reserve spare capacity and are evicted first.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: capacity-buffer
  namespace: capacity-buffer
spec:
  replicas: 3                       # one per zone; tune to the buffer you need
  selector:
    matchLabels:
      app.kubernetes.io/name: capacity-buffer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: capacity-buffer
    spec:
      priorityClassName: overprovisioning
      terminationGracePeriodSeconds: 0
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: capacity-buffer
      # Target the same node pool as the workloads the buffer protects, e.g.:
      # nodeSelector:
      #   karpenter.sh/nodepool: on-demand-web
      # tolerations:
      #   - {key: workload-class, value: web, effect: NoSchedule}
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: "1"              # each replica reserves this much capacity
              memory: 2Gi
            limits:
              memory: 2Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65535
            seccompProfile:
              type: RuntimeDefault
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

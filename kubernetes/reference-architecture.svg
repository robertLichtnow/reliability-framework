<svg xmlns="http://www.w3.org/2000/svg" width="960" height="790" viewBox="0 0 960 790" font-family="Helvetica, Arial, sans-serif">
  <title>High-availability Kubernetes reference architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #374151; stroke-width: 1.5; }
      .edge { fill: #eef2ff; stroke: #4f46e5; stroke-width: 1.5; }
      .zone { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.5; }
      .pod { fill: #ffffff; stroke: #16a34a; stroke-width: 1.2; }
      .data { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.5; }
      .line { stroke: #374151; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #ea580c; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
      .t { font-size: 15px; fill: #111827; text-anchor: middle; }
      .tb { font-size: 16px; font-weight: bold; fill: #111827; text-anchor: middle; }
      .s { font-size: 12.5px; fill: #4b5563; text-anchor: middle; }
      .zl { font-size: 15px; font-weight: bold; fill: #166534; text-anchor: middle; }
      .cl { font-size: 16px; font-weight: bold; fill: #1f2937; }
    </style>
  </defs>

  <rect width="960" height="790" fill="#ffffff"/>

  <!-- Users -->
  <rect x="400" y="20" width="160" height="44" rx="22" class="edge"/>
  <text x="480" y="48" class="tb">Users</text>
  <path d="M480,64 L480,92" class="line"/>

  <!-- Edge -->
  <rect x="330" y="94" width="300" height="50" rx="8" class="edge"/>
  <text x="480" y="116" class="t">DNS + CDN + web application firewall</text>
  <text x="480" y="134" class="s">Global entry point, blocks malicious traffic</text>
  <path d="M480,144 L480,172" class="line"/>

  <!-- Load balancer -->
  <rect x="230" y="174" width="500" height="50" rx="8" class="edge"/>
  <text x="480" y="196" class="t">Cloud load balancer</text>
  <text x="480" y="214" class="s">Spans all three zones, sends traffic only to healthy pods</text>

  <!-- Cluster -->
  <rect x="40" y="262" width="880" height="330" rx="14" fill="#f9fafb" stroke="#1f2937" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="60" y="574" class="cl">One Kubernetes cluster</text>
  <text x="900" y="574" class="s" text-anchor="end" style="text-anchor:end">Control plane managed by the cloud provider, itself multi-zone</text>

  <!-- LB to zones -->
  <path d="M330,224 L190,318" class="line"/>
  <path d="M480,224 L480,318" class="line"/>
  <path d="M630,224 L770,318" class="line"/>

  <!-- Zone A -->
  <rect x="70" y="320" width="240" height="220" rx="10" class="zone"/>
  <text x="190" y="346" class="zl">Availability zone A</text>
  <rect x="95" y="362" width="190" height="44" rx="6" class="pod"/>
  <text x="190" y="389" class="t">Ingress pods</text>
  <rect x="95" y="418" width="190" height="56" rx="6" class="pod"/>
  <text x="190" y="442" class="t">Application pods</text>
  <text x="190" y="461" class="s">at least one copy of each service</text>
  <text x="190" y="508" class="s">Worker nodes (autoscaled)</text>

  <!-- Zone B -->
  <rect x="360" y="320" width="240" height="220" rx="10" class="zone"/>
  <text x="480" y="346" class="zl">Availability zone B</text>
  <rect x="385" y="362" width="190" height="44" rx="6" class="pod"/>
  <text x="480" y="389" class="t">Ingress pods</text>
  <rect x="385" y="418" width="190" height="56" rx="6" class="pod"/>
  <text x="480" y="442" class="t">Application pods</text>
  <text x="480" y="461" class="s">at least one copy of each service</text>
  <text x="480" y="508" class="s">Worker nodes (autoscaled)</text>

  <!-- Zone C -->
  <rect x="650" y="320" width="240" height="220" rx="10" class="zone"/>
  <text x="770" y="346" class="zl">Availability zone C</text>
  <rect x="675" y="362" width="190" height="44" rx="6" class="pod"/>
  <text x="770" y="389" class="t">Ingress pods</text>
  <rect x="675" y="418" width="190" height="56" rx="6" class="pod"/>
  <text x="770" y="442" class="t">Application pods</text>
  <text x="770" y="461" class="s">at least one copy of each service</text>
  <text x="770" y="508" class="s">Worker nodes (autoscaled)</text>

  <!-- Cluster to data -->
  <path d="M300,592 L300,630" class="line"/>
  <path d="M700,592 L700,630" class="line"/>

  <!-- Data layer -->
  <rect x="70" y="632" width="470" height="110" rx="10" class="data"/>
  <text x="305" y="658" class="tb">Managed database</text>
  <rect x="95" y="674" width="190" height="50" rx="6" class="box"/>
  <text x="190" y="696" class="t">Primary</text>
  <text x="190" y="714" class="s">zone A</text>
  <rect x="325" y="674" width="190" height="50" rx="6" class="box"/>
  <text x="420" y="696" class="t">Standby</text>
  <text x="420" y="714" class="s">zone B, automatic failover</text>
  <path d="M285,699 L325,699" class="dash"/>

  <rect x="580" y="632" width="310" height="110" rx="10" class="data"/>
  <text x="735" y="664" class="tb">Managed queue and cache</text>
  <text x="735" y="688" class="s">Replicated across zones</text>
  <text x="735" y="710" class="s">Messages and cached data survive</text>
  <text x="735" y="727" class="s">the loss of a zone</text>

  <text x="480" y="774" class="s">Losing any one zone leaves two zones serving traffic. State lives in managed, multi-zone data services, not in the cluster.</text>
</svg>

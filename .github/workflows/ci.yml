name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Unit tests
        run: python -m unittest discover -s tools -v
      - name: Validate every SLO file and generate its rules
        run: |
          mkdir -p generated
          for f in $(find slo -name slo.yaml); do
            python tools/slo_tool.py check "$f"
            python tools/slo_tool.py rules "$f" > "generated/$(echo "$f" | tr / _)"
          done
      - name: Validate Prometheus rules with promtool
        run: |
          docker run --rm -v "$PWD:/work" -w /work --entrypoint /bin/promtool prom/prometheus:v3.5.0 \
            check rules slo/examples/checkout-api/prometheus-rules.yaml generated/*
      - name: Unit-test the example alerts with promtool
        run: |
          docker run --rm -v "$PWD:/work" -w /work/slo/examples/checkout-api --entrypoint /bin/promtool prom/prometheus:v3.5.0 \
            test rules alerts-test.yaml
      - name: Validate Kubernetes example manifests
        run: |
          docker run --rm -v "$PWD:/work" ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary -kubernetes-version 1.31.0 /work/kubernetes/example-deployment.yaml /work/kubernetes/example-overprovisioning.yaml

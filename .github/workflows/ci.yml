name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Unit tests
        run: python -m unittest discover -s tools -v
      - name: Validate every SLO file
        run: |
          for f in $(find slo -name slo.yaml); do python tools/slo_tool.py check "$f"; done
      - name: Validate generated Prometheus rules with promtool
        run: |
          docker run --rm -v "$PWD:/work" --entrypoint /bin/promtool prom/prometheus:v2.53.2 \
            check rules /work/slo/examples/checkout-api/prometheus-rules.yaml
